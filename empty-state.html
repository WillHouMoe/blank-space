<!--
  空状态占位：铺满所在容器、动画居中，无外框、无任何文字、无外部依赖。
  可调：data-variant="layers | orbit | ripple"，--es-accent（主色），--es-size（图案尺寸）。
  深浅色跟随系统，prefers-reduced-motion 时自动停在静态画面。
-->
<div id="empty-state" data-variant="layers">
  <style>
    #empty-state {
      --es-size: clamp(240px, 50vmin, 560px);
      --es-accent: #5b7cfa;
      --es-card: light-dark(rgb(238 240 246), rgb(45 48 58));
      --es-card-front: light-dark(rgb(255 255 255), rgb(62 66 78));
      --es-stroke: light-dark(rgb(209 215 227), rgb(92 98 114));
      --es-shadow: light-dark(rgb(15 23 42 / 12%), rgb(0 0 0 / 55%));

      display: grid;
      place-items: center;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      min-height: 100%;
      padding: 24px;
      color-scheme: light dark;
    }

    #empty-state .es-stage {
      width: var(--es-size);
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 1 / 1;
    }

    #empty-state .es-art {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
    }

    #empty-state .es-v {
      display: none;
    }

    #empty-state[data-variant="layers"] .es-layers,
    #empty-state[data-variant="orbit"] .es-orbit,
    #empty-state[data-variant="ripple"] .es-ripple {
      display: block;
    }

    #empty-state .es-glow {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: es-breathe 6.4s ease-in-out infinite;
    }

    #empty-state .es-card rect {
      fill: var(--es-card);
      stroke: var(--es-stroke);
      stroke-width: 1.5;
    }

    #empty-state .es-card-front rect {
      fill: var(--es-card-front);
      filter: drop-shadow(0 12px 18px var(--es-shadow));
    }

    #empty-state .es-core rect {
      fill: var(--es-card-front);
      stroke: var(--es-stroke);
      stroke-width: 1.5;
      filter: drop-shadow(0 12px 18px var(--es-shadow));
    }

    #empty-state .es-bob {
      animation: es-bob 4.4s ease-in-out infinite;
    }

    #empty-state .es-bob-2 {
      animation-delay: -1.45s;
    }

    #empty-state .es-bob-3 {
      animation-delay: -2.9s;
    }

    #empty-state .es-dot {
      fill: var(--es-accent);
    }

    #empty-state .es-dot-soft {
      fill: var(--es-accent);
      opacity: 0.42;
    }

    #empty-state .es-orbiter {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: es-spin 18s linear infinite;
    }

    #empty-state .es-orbiter-b {
      animation-duration: 27s;
      animation-direction: reverse;
    }

    #empty-state .es-orbiter-c {
      animation-duration: 14s;
    }

    #empty-state .es-orbiter-d {
      animation-duration: 22s;
      animation-direction: reverse;
    }

    #empty-state .es-ring {
      fill: none;
      stroke: var(--es-stroke);
      stroke-width: 1.5;
      stroke-dasharray: 3 9;
      stroke-linecap: round;
    }

    #empty-state .es-ring-accent {
      stroke: var(--es-accent);
      opacity: 0.45;
    }

    #empty-state .es-spin {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: es-spin 44s linear infinite;
    }

    #empty-state .es-spin-rev {
      animation-duration: 58s;
      animation-direction: reverse;
    }

    #empty-state .es-core {
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: es-core 5.2s ease-in-out infinite;
    }

    #empty-state .es-ripple-ring {
      fill: none;
      stroke: var(--es-accent);
      stroke-width: 1.5;
      transform-box: view-box;
      transform-origin: 120px 120px;
      animation: es-ripple 3.9s cubic-bezier(0.22, 0.61, 0.36, 1) infinite;
    }

    #empty-state .es-ripple-ring:nth-of-type(2) {
      animation-delay: -1.3s;
    }

    #empty-state .es-ripple-ring:nth-of-type(3) {
      animation-delay: -2.6s;
    }

    @keyframes es-bob {
      0%,
      100% {
        transform: translateY(-6px);
      }
      50% {
        transform: translateY(6px);
      }
    }

    @keyframes es-breathe {
      0%,
      100% {
        transform: scale(0.96);
        opacity: 0.72;
      }
      50% {
        transform: scale(1.06);
        opacity: 1;
      }
    }

    @keyframes es-spin {
      from {
        transform: rotate(0deg);
      }
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes es-core {
      0%,
      100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.05);
      }
    }

    @keyframes es-ripple {
      0% {
        transform: scale(1);
        opacity: 0.5;
      }
      100% {
        transform: scale(2.2);
        opacity: 0;
      }
    }

    @media (max-width: 520px) {
      #empty-state {
        padding: 16px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      #empty-state .es-art * {
        animation: none !important;
      }
    }
  </style>

  <div class="es-stage">
    <svg
      class="es-art"
      viewBox="0 0 240 240"
      role="img"
      aria-label="空状态占位"
    >
      <defs>
        <radialGradient id="es-halo-grad" cx="50%" cy="50%" r="50%">
          <stop class="es-halo-stop" offset="0%" />
          <stop class="es-halo-stop-mid" offset="58%" />
          <stop class="es-halo-stop-end" offset="100%" />
        </radialGradient>
        <style>
          #empty-state .es-halo-stop {
            stop-color: var(--es-accent);
            stop-opacity: 0.32;
          }
          #empty-state .es-halo-stop-mid {
            stop-color: var(--es-accent);
            stop-opacity: 0.12;
          }
          #empty-state .es-halo-stop-end {
            stop-color: var(--es-accent);
            stop-opacity: 0;
          }
        </style>
      </defs>

      <g class="es-v es-layers">
        <circle class="es-glow" cx="120" cy="120" r="98" fill="url(#es-halo-grad)" />
        <g class="es-orbiter es-orbiter-a">
          <circle class="es-dot" cx="120" cy="26" r="5" />
        </g>
        <g class="es-orbiter es-orbiter-b">
          <circle class="es-dot-soft" cx="120" cy="44" r="3.5" />
        </g>
        <g class="es-card es-card-back" transform="rotate(-13 120 120)">
          <g class="es-bob es-bob-1">
            <rect x="58" y="58" width="124" height="84" rx="22" />
          </g>
        </g>
        <g class="es-card es-card-mid">
          <g class="es-bob es-bob-2">
            <rect x="58" y="74" width="124" height="84" rx="22" />
          </g>
        </g>
        <g class="es-card es-card-front" transform="rotate(13 120 120)">
          <g class="es-bob es-bob-3">
            <rect x="58" y="90" width="124" height="84" rx="22" />
          </g>
        </g>
      </g>

      <g class="es-v es-orbit">
        <circle class="es-glow" cx="120" cy="120" r="98" fill="url(#es-halo-grad)" />
        <g class="es-spin es-spin-rev">
          <circle class="es-ring es-ring-accent" cx="120" cy="120" r="96" />
        </g>
        <g class="es-spin">
          <circle class="es-ring" cx="120" cy="120" r="74" />
        </g>
        <g class="es-orbiter es-orbiter-c">
          <circle class="es-dot" cx="120" cy="46" r="5" />
        </g>
        <g class="es-orbiter es-orbiter-d">
          <circle class="es-dot-soft" cx="120" cy="24" r="3.5" />
        </g>
        <g class="es-core">
          <rect x="84" y="84" width="72" height="72" rx="22" />
        </g>
      </g>

      <g class="es-v es-ripple">
        <circle class="es-glow" cx="120" cy="120" r="98" fill="url(#es-halo-grad)" />
        <rect class="es-ripple-ring" x="84" y="84" width="72" height="72" rx="22" />
        <rect class="es-ripple-ring" x="84" y="84" width="72" height="72" rx="22" />
        <rect class="es-ripple-ring" x="84" y="84" width="72" height="72" rx="22" />
        <g class="es-core">
          <rect x="84" y="84" width="72" height="72" rx="22" />
        </g>
      </g>
    </svg>
  </div>

  <script>
    (() => {
      const root = document.getElementById("empty-state");
      if (!root) return;

      const state = { variant: "layers", accent: "#5b7cfa" };

      const render = () => {
        root.dataset.variant = state.variant;
        root.style.setProperty("--es-accent", state.accent);
      };
      render();

      if (globalThis.Tweak) {
        const tweak = new Tweak({ container: root, onChange: render });
        tweak.addSelect(state, "variant", {
          label: "动画",
          options: [
            { label: "层叠卡片", value: "layers" },
            { label: "轨道环绕", value: "orbit" },
            { label: "波纹扩散", value: "ripple" },
          ],
        });
        tweak.addColorPicker(state, "accent", {
          label: "主色",
          reference: "--es-accent",
        });
      }
    })();
  </script>
</div>
